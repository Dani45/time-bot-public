stages:
  - dispatch

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

run_dispatch:
  stage: dispatch
  tags:
    - python3.12
  script:
    - echo "Ejecutando el disparador en GitLab CI"
    - python scripts/dispatch_private_workflow.py --help
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "manual"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
